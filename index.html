<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匿名丸ch 公式ホームページ</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f5f8;
      color: #222;
      line-height: 1.7;
    }
    header {
      background: #252b42;
      color: white;
      text-align: center;
      padding: 55px 20px;
    }
    header h1 {
      margin: 0;
      font-size: 32px;
    }
    nav {
      background: #39425e;
      padding: 12px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 12px;
    }
    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 16px;
    }
    section {
      background: white;
      padding: 25px;
      margin-bottom: 22px;
      border-radius: 12px;
    }
    h2 {
      border-bottom: 2px solid #5968a3;
      padding-bottom: 8px;
    }
    .button {
      display: inline-block;
      background: #d62828;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>
<body>

<header>
  <h1>匿名丸ch</h1>
  <p>公式ホームページへようこそ！</p>
</header>

<nav>
  <a href="#about">チャンネル紹介</a>
  <a href="#series">動画シリーズ</a>
  <a href="#news">お知らせ</a>
</nav>

<main>
  <section id="about">
    <h2>チャンネル紹介</h2>
    <p>
      匿名丸chでは、にゃんこ大戦争や
      Minecraftを中心にゲーム動画を制作しています。
    </p>
    <a class="button" href="https://www.youtube.com/"
       target="_blank" rel="noopener noreferrer">
      YouTubeはこちら
    </a>
  </section>

  <section id="series">
    <h2>動画シリーズ</h2>
    <h3>シン0にゃん</h3>
    <p>にゃんこ大戦争の企画シリーズ。</p>

    <h3>旧0にゃん</h3>
    <p>過去の0にゃんシリーズの記録。</p>

    <h3>初心ドラ</h3>
    <p>Minecraftでエンダードラゴン討伐を目指すシリーズ。</p>
  </section>

  <section id="news">
    <h2>お知らせ</h2>
    <p>今後、チャンネルの最新情報を掲載予定です。</p>
  </section>
</main>

<footer>
  <p>匿名丸ch 公式ホームページ</p>
</footer>

</body>
</html>
