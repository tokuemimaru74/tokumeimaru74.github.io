<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匿名丸ch 公式ホームページ</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f5f8;
      color: #222;
      font-size: 17px;
    }
    header {
     background: #161b35;
      padding: 0;
      text-align: center;
    }
    .channel-banner {
      display: block;
      width: 100%;
      max-width: 1920px;
      height: auto;
      margin: 0 auto;
    }
  
    header h1 {
      margin: 0;
      font-size: 32px;
    }
    nav {
      background: #39425e;
      padding: 12px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 12px;
    }
    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 16px;
    }
    section {
      background: white;
      padding: 25px;
      margin-bottom: 22px;
      border-radius: 12px;
    }
    h2 {
      border-bottom: 2px solid #5968a3;
      padding-bottom: 8px;
    }
    .button {
      display: inline-block;
      background: #d62828;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
   section p {
   line-height:1.9;
  }
   
    #community .button {
      background: #5865F2;
    }


/* スマートフォン向けの表示調整 */
@media (max-width: 600px) {
  nav {
    padding: 12px 8px;
  }

  nav a {
    display: inline-block;
    font-size: 13px;
    margin: 5px 6px;
  }

  main {
    margin: 18px auto;
    padding: 0 12px;
  }

  section {
    padding: 20px;
    margin-bottom: 16px;
  }

  h2 {
    font-size: 23px;
  }

  h3 {
    font-size: 19px;
  }

  section p {
    font-size: 15px;
    line-height: 1.8;
  }

  .button {
    font-size: 15px;
    padding: 10px 16px;
  }
}

.video {
  width: 100%;
  max-width: 700px;
  aspect-ratio: 16 / 9;
  margin: 20px auto;
}

.video iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 10px;
}

  </style>
</head>
<body>
<header>
  <img src="banner.png"
       alt="匿名丸ch 公式バナー"
       class="channel-banner">
</header>
  
<nav>
  <a href="#about">チャンネル紹介</a>
  <a href="#series">動画シリーズ</a>
  <a href="#history">チャンネルの歩み</a>
  <a href="#news">お知らせ</a>
  <a href="#community">視聴者コミュニティ</a>
</nav>


<main>
  <section id="series">
    <h2>動画シリーズ一覧</h2>

    <h3>シン0にゃん</h3>
    <div class="video">
      <iframe
        src="https://www.youtube.com/embed/eaytItQ_S-Y"
        title="シン0にゃん Part1"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
    <p>
      にゃんこ大戦争を無課金・リセマラなしで
      攻略するシリーズ。
    </p>

    <h3>旧0にゃん</h3>
    <p>
      過去に投稿した0にゃんシリーズの記録。
    </p>

    <h3>初心ドラ</h3>
    <div class="video">
      <iframe
        src="https://www.youtube.com/embed/qi2WZqR7kGg"
        title="旧初心ドラ Part1"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
    <p>
      Minecraftのハードコアモードで
      エンダードラゴン討伐を目指すシリーズ。
    </p>
  </section>
</main>

<footer>
  <p>匿名丸ch 公式ホームページ</p>
</footer>

</body>
</html>
